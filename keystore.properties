# 发布签名配置。keystore 与本文件一起纳入仓库，目的是让本地构建、自建 CI 与
# GitHub Actions 产出的 APK 使用同一把密钥，从而可以互相覆盖升级。
#
# 注意：这是一把公开的密钥——任何拿到本仓库的人都能用它签出「同样是 Winlator-CN」
# 的 APK。对当前的分发方式（用户自己下载安装、不走应用商店）来说并不降低安全性，
# 因为此前的 debug 密钥同样是公开且每台机器随机生成的。如果哪天要上架应用商店，
# 必须换一把私有的、绝不入库的密钥，并接受一次「必须卸载重装」的代价。
storeFile=keystore/release.jks
