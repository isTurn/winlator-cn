name: 编译apk（含C编译）

on:
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  NDK_VERSION: '24.0.8215888'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: false
          fetch-depth: 1

      # 这里原本有一句 rm -rf app/src/main/assets，是为了让「assets 不在仓库里」的时代
      # 也能跑通构建。现在 rootfs.tzst 等资产已经入库，删掉 assets 只会产出一个装上去
      # 就起不来的空壳 APK，所以改成构建前校验，缺文件就直接失败并指出缺哪个。
      - name: Verify assets
        run: |
          missing=0
          for f in rootfs.tzst rootfs_patches.tzst container_pattern.tzst \
                   container_addons.tzst xkb.tzst gst_codecs.tzst wfm.tzst pulseaudio.tzst; do
            if [ ! -s "app/src/main/assets/$f" ]; then
              echo "::error::缺少必需资产 app/src/main/assets/$f"
              missing=1
            else
              echo "ok  $f  $(stat -c%s "app/src/main/assets/$f") bytes"
            fi
          done
          # dotnet.tzst（.NET 运行时，压缩后约 60 MB）超过 GitHub 单文件推送上限，
          # 只随 Releases 里的 APK 分发，不入库。缺失时仅警告：产出的 APK 少了
          # C:\windows\mono 与 C:\windows\Microsoft.NET，带 .NET 的程序跑不起来，
          # 其余功能不受影响。
          if [ ! -s "app/src/main/assets/dotnet.tzst" ]; then
            echo "::warning::缺少可选资产 dotnet.tzst，本次产出的 APK 不含内置 .NET 运行时"
          else
            echo "ok  dotnet.tzst  $(stat -c%s "app/src/main/assets/dotnet.tzst") bytes"
          fi
          exit $missing

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # 不能用该 action 的默认值 "tools platform-tools"：Google 已将遗留的
          # tools(Android SDK Tools) 包从 SDK 仓库下架，sdkmanager tools 会报
          # "Failed to find package 'tools'" 并让本步骤以退出码 1 失败，
          # 整个 job 在 Gradle 启动前就中止。
          # 已核对 v4 的 action.yml：packages 默认值仍是 "tools platform-tools"
          # (v3 -> v4 只改了 node20 -> node24 与 cmdline-tools 默认版本号)，
          # 所以升级之后这条覆盖依然必须保留。
          packages: platform-tools

      - name: Install NDK and CMake
        run: |
          sdkmanager --install "ndk;${{ env.NDK_VERSION }}" "cmake;3.22.1"

      - name: Build release APK
        # 签名配置在 app/build.gradle 里从仓库根的 keystore.properties 读取，
        # keystore 本身也入库，所以这里不再生成临时密钥。产出的 APK 与本地、
        # 与其它 CI 的签名完全一致，可以互相覆盖升级。
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Rename APK
        run: |
          BRANCH=${GITHUB_REF#refs/heads/}
          BRANCH=${BRANCH//\//-}
          SHA=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          mv app/build/outputs/apk/release/app-release.apk "Winlator-native-${BRANCH}-${SHA}-${TIMESTAMP}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-native
          path: "*.apk"
          retention-days: 7