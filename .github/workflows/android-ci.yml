name: 编译检查（仅Java，产物不可安装）

on:
  push:
    branches: ['**']
  workflow_dispatch:

env:
  JAVA_VERSION: '17'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: false # 彻底禁止下载任何LFS文件
          fetch-depth: 1 # 只拉取最新一次提交

      # 原本这里是 rm -rf app/src/main/assets，会把 rootfs.tzst 等运行时资产一并删掉。
      # 现在资产已入库，改成校验：缺任何一个直接失败，而不是静默产出一个空壳 APK。
      - name: Verify assets
        run: |
          missing=0
          for f in rootfs.tzst rootfs_patches.tzst container_pattern.tzst \
                   container_addons.tzst xkb.tzst gst_codecs.tzst wfm.tzst pulseaudio.tzst; do
            if [ ! -s "app/src/main/assets/$f" ]; then
              echo "::error::缺少必需资产 app/src/main/assets/$f"
              missing=1
            fi
          done
          exit $missing

      - name: Remove native sources
        # 配合下面 assembleRelease 的 -PskipNative：本流程不编译任何 C/C++。
        # 删掉 cpp 还能在 -PskipNative 万一被漏掉时立刻构建失败，
        # 而不是悄悄退回去做一次完整的原生编译。
        # 注意：跳过原生构建也意味着 APK 里没有 libwinlator.so，
        # 而 MainApplication 启动时就会 loadLibrary("winlator")，
        # 所以本流程的产物只能用来验证 Java 能否编译，无法安装运行。
        # 需要可安装的包请用 build-native.yml。
        run: rm -rf app/src/main/cpp

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'
      
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # 不能用该 action 的默认值 "tools platform-tools"：Google 已将遗留的
          # tools(Android SDK Tools) 包从 SDK 仓库下架，sdkmanager tools 会报
          # "Failed to find package 'tools'" 并让本步骤以退出码 1 失败，
          # 整个 job 在 Gradle 启动前就中止。
          # 已核对 v4 的 action.yml：packages 默认值仍是 "tools platform-tools"
          # (v3 -> v4 只改了 node20 -> node24 与 cmdline-tools 默认版本号)，
          # 所以升级之后这条覆盖依然必须保留。
          packages: platform-tools

      - name: Build release APK
        # 签名配置在 app/build.gradle 里从仓库根的 keystore.properties 读取，
        # keystore 本身也入库，所以这里不再生成临时密钥。
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PskipNative
      - name: Rename APK
        run: |
          BRANCH=${GITHUB_REF#refs/heads/}
          BRANCH=${BRANCH//\//-}
          SHA=$(git rev-parse --short HEAD)
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          # 文件名里带 java-only，避免被当成可安装的发行包拿走。
          mv app/build/outputs/apk/release/app-release.apk "Winlator-java-only-${BRANCH}-${SHA}-${TIMESTAMP}.apk"
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-java-only
          path: "*.apk"
          retention-days: 7